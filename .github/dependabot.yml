version: 2
updates:
  # tipjar has no runtime dependencies; this keeps the dev tools current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    versioning-strategy: increase
  # The API docs page's own tools: TypeDoc pins TypeScript 6, so they live apart from the package.
  - package-ecosystem: npm
    directory: /tools/api-docs
    schedule:
      interval: monthly
    groups:
      api-docs:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
